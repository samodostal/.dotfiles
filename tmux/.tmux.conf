set -g default-command "${SHELL}"
set -sg escape-time 0
set-option -g focus-events on

set-option -a terminal-features 'xterm-256color:RGB'

unbind C-b
set-option -g prefix C-u
bind-key C-u send-prefix

set -g base-index 1
setw -g pane-base-index 1

setw -g mouse on

set-window-option -g mode-keys vi
set-option -g renumber-windows on

set -gq allow-passthrough all
set -g visual-activity off

set-option -g popup-style "bg=default,fg=default"
set-option -g popup-border-style "bg=default,fg=#3c3836"

bind-key b choose-tree -swZ
bind-key n display-popup -w 60% -h 60% -E tmux-open-project.sh
bind-key t switch-client -l
bind-key i set -g status

bind-key -r p attach-session -t home
bind-key -r . attach-session -t dotfiles
bind-key -r , attach-session -t notes
bind-key -r y attach-session -t ghci 
bind-key -r g attach-session -t gerry_dae

bind-key l split-window -h
bind-key s split-window -v

bind-key -r J resize-pane -D 20
bind-key -r K resize-pane -U 20
bind-key -r H resize-pane -L 20
bind-key -r L resize-pane -R 20

bind-key h select-window -t 1
bind-key m select-window -t 2
bind-key w select-window -t 3
bind-key v select-window -t 4
bind-key z select-window -t 5


is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n "C-h" if-shell "$is_vim" "send-keys C-h" { if -F "#{pane_at_left}" "" "select-pane -L" }
bind-key -n "C-j" if-shell "$is_vim" "send-keys C-j" { if -F "#{pane_at_bottom}" "" "select-pane -D" }
bind-key -n "C-k" if-shell "$is_vim" "send-keys C-k" { if -F "#{pane_at_top}" "" "select-pane -U" }
bind-key -n "C-l" if-shell "$is_vim" "send-keys C-l" { if -F "#{pane_at_right}" "" "select-pane -R" }

bind-key -T copy-mode-vi "C-h" if -F "#{pane_at_left}" "" "select-pane -L"
bind-key -T copy-mode-vi "C-j" if -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -T copy-mode-vi "C-k" if -F "#{pane_at_top}" "" "select-pane -U"
bind-key -T copy-mode-vi "C-l" if -F "#{pane_at_right}" "" "select-pane -R"

set -gu @plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

set-option -g pane-active-border-style bg=default,fg=#3c3836
set-option -g pane-border-style bg=default,fg=#3c3836

set-option -g status-style "bg=default,fg=#928374"
set-option -g status-left "#[bg=default,fg=#e9b143,bold] #S "
set-option -g status-right '#[bg=default,fg=#928374] #($HOME/.config/shell_scripts/git-stats.sh "#{pane_current_path}") '
set-option -g status-left-length 40
set-option -g status-right-length 80
set-option -g status-interval 5
set-option -g status-justify left
set-option -g window-status-format "#[bg=default,fg=#928374] #I #W "
set-option -g window-status-current-style default
set-option -g window-status-current-format "#[bg=default,fg=#ebdbb2,bold] #I #W "
set-option -g window-status-separator ""
set-option -g message-style "bg=#1d2021,fg=#ebdbb2"
set-option -g message-command-style "bg=#1d2021,fg=#ebdbb2"
set-option -g clock-mode-colour "#d79921"
