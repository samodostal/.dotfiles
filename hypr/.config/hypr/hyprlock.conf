$font = JetBrains Mono
$fg   = rgb(ffffff)

general {
	hide_cursor        = true
	ignore_empty_input = true
}

animations {
	enabled = false
}

background {
	monitor =
	color   = rgb(000000)
}

label {
	monitor       =
	text          = <b>user:</b> $USER
	font_family   = $font
	font_size     = 16
	color         = $fg
	shadow_passes = 0
	position      = 0, 14
	halign        = center
	valign        = center
}

label {
	monitor       =
	text          = <b>password:</b> xxxx
	font_family   = $font
	font_size     = 16
	color         = $fg
	shadow_passes = 0
	position      = -13, -14
	halign        = center
	valign        = center
}

input-field {
	monitor           =
	size              = 24%, 1
	outline_thickness = 0
	inner_color       = rgba(00000000)
	outer_color       = rgba(00000000)
	font_family       = $font
	fade_on_empty     = false
	dots_size         = 0.001
	dots_text_format  =
	placeholder_text  =
	check_text        =
	fail_text         =
	check_color       = rgba(00000000)
	fail_color        = rgba(00000000)
	capslock_color    = rgba(00000000)
	numlock_color     = rgba(00000000)
	bothlock_color    = rgba(00000000)
	position          = 0, 0
	halign            = center
	valign            = center
}
