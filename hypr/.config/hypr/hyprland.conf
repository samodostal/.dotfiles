monitor=eDP-1, preferred, auto, 1.0
monitor=HDMI-A-1, preferred, auto, 1.5
monitor=,preferred,auto,auto

$browser = firefox
$terminal = wezterm
$mail = thunderbird
$todo = superproductivity
$fileManager = thunar
$bluetoothManager = blueman-manager
$passwordManager = Bitwarden
$menu = wofi --show drun
$spotify = spotify

env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18

general {
	gaps_in = 0
		gaps_out = 0

		border_size = 0

		col.active_border = rgba(aaaaaaaa)
		col.inactive_border = rgba(333333aa)

		resize_on_border = false
		allow_tearing = false

		layout = dwindle
}

decoration {
	rounding = 0

		active_opacity = 1.0
		inactive_opacity = 1.0

		shadow {
			enabled = false
		}

	blur {
		enabled = false
	}
}

animations {
	enabled = false
}

dwindle {
# pseudotile = true
	preserve_split = true
}

master {
	new_status = master
}

misc {
	disable_splash_rendering = true
		force_default_wallpaper = 0
		disable_hyprland_logo = true
		focus_on_activate = true
}

input {
	kb_layout = us,us
		kb_variant = dvorak,
							 kb_options = caps:swapescape,grp:win_space_toggle

								 follow_mouse = 1

								 touchpad {
									 natural_scroll = false
										 scroll_factor = 0.20
								 }
}

xwayland {

}

device {
	name = samodostal-one_mcu_dactyl_5x6
		kb_layout = us
		kb_variant = ,
							 kb_options = grp:win_space_toggle
								 resolve_binds_by_sym = 1
}

device {
	name = samodostal-3x3_sencha
		kb_layout = us
		kb_variant = ,
							 kb_options = grp:win_space_toggle
								 resolve_binds_by_sym = 1
}

device {
	name = corne-keyboard
		kb_layout = us
		kb_variant = ,
							 kb_options = grp:win_space_toggle
								 resolve_binds_by_sym = 1
}

device {
	name = zmk-project-corne-keyboard
		kb_layout = us
		kb_variant = ,
							 kb_options = grp:win_space_toggle
								 resolve_binds_by_sym = 1
}

device {
	name = dualsense-wireless-controller-touchpad
		enabled = false
}

$altMod = ALT
$winMod = SUPER

bind = $altMod, F, fullscreen
bind = $altMod, P, movecurrentworkspacetomonitor, +1
bind = $altMod, O, swapnext
bind = $altMod, G, exec, confirm-kill-window.sh
bind = $altMod, C, togglespecialworkspace, gemini

bindm = $winMod, mouse:272, movewindow
bindm = $winMod, mouse:273, resizewindow

bind = $altMod, E, exec, $fileManager
bind = $altMod, D, exec, $menu
bind = $altMod, T, exec, $terminal

bind = $altMod, R, submap, resize
submap = resize
binde = , L, resizeactive, 30 0
binde = , H, resizeactive, -30 0
binde = , K, resizeactive, 0 -30
binde = , J, resizeactive, 0 30
bind = , escape, submap, reset
submap = reset

bind = $altMod, A, togglefloating
bind = $altMod, C, centerwindow

bind = $winMod, L, movefocus, l
bind = $winMod, H, movefocus, r
bind = $winMod, K, movefocus, u
bind = $winMod, J, movefocus, d

bind = $altMod, H, workspace, 1
bind = $altMod, M, workspace, 2
bind = $altMod, W, workspace, 3
bind = $altMod, V, workspace, 4
bind = $altMod, Z, workspace, 5
bind = $altMod, ;, workspace, 6
bind = $altMod, Q, workspace, 7
bind = $altMod, J, workspace, 8
bind = $altMod, K, workspace, 9
bind = $altMod, U, workspace, 10

bind = $altMod $winMod, P, exec, hyprpicker --autocopy
bind = $altMod $winMod, S, exec, grimshot copy area
bind = , XF86Display, exec, grim ~/Screenshots/$(date +%Y%m%d_%H%M%S).png

bind = $altMod SHIFT, H, movetoworkspace, 1
bind = $altMod SHIFT, M, movetoworkspace, 2
bind = $altMod SHIFT, W, movetoworkspace, 3
bind = $altMod SHIFT, V, movetoworkspace, 4
bind = $altMod SHIFT, Z, movetoworkspace, 5
bind = $altMod SHIFT, ;, movetoworkspace, 6
bind = $altMod SHIFT, Q, movetoworkspace, 7
bind = $altMod SHIFT, J, movetoworkspace, 8
bind = $altMod SHIFT, K, movetoworkspace, 9
bind = $altMod SHIFT, U, movetoworkspace, 10

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86HangupPhone, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86PickupPhone, exec, playerctl previous
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86NotificationCenter, exec, playerctl play-pause
bindl = , XF86Favorites, exec, hyprshade toggle vibrant

windowrule {
	name = gemini_scratch
		match:class = ^gemini-scratch$
		float = on
		size = 1400 900
		center = on
}

windowrule {
	name = float_managers
		match:class = ^($fileManager|$bluetoothManager|$passwordManager)$
		float = on
		size = 1200 800
}

windowrule {
	name = godot_run
		match:class = ^(game_001)$
		float = on
}

windowrule {
	name = pip_float
		match:title = ^Picture-in-Picture$
		float = on
		pin = on
		move = ((monitor_w*1)-window_w-20)
		size = (monitor_w*0.25) (monitor_h*0.25)
}

windowrule {
	name = float_border
		match:float = 1
		border_size = 1
		border_color = rgb(000000)
}

windowrule {
	name = global_persistence
		match:class = .*
		persistent_size = on
}

exec-once = [workspace special:gemini silent] firefox --class gemini-scratch --new-window https://gemini.google.com

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = ydotoold
exec-once = thunar --daemon

exec-once = [workspace 1 silent; monitor HDMI-A-1] $browser
exec-once = [workspace 2 silent; monitor HDMI-A-1] $terminal
exec-once = [workspace 7 silent; monitor HDMI-A-1] $mail
exec-once = [workspace 8 silent; monitor HDMI-A-1] $todo
exec-once = [workspace 9 silent; monitor HDMI-A-1] $spotify
