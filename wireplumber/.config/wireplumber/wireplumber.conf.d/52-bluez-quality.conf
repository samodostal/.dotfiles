wireplumber.settings = {
  bluetooth.profile-preference = quality
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.use-persistent-storage = false
  device.restore-profile = false
}

monitor.bluez.properties = {
  bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-hw-volume = false
  bluez5.a2dp.ldac.quality = sq
}

monitor.bluez.rules = [
  {
    matches = [ { "device.name" = "~bluez_card.*" } ]
    actions = {
      update-props = {
        "api.alsa.period-size" = 1024
        "api.alsa.headroom" = 2048
      }
    }
  }
  {
    matches = [ { "api.bluez5.address" = "CC:98:8B:9A:18:2C" } ]
    actions = { update-props = { "bluez5.codecs" = [ ldac aac sbc_xq sbc ] } }
  }
  {
    matches = [ { "api.bluez5.address" = "30:D8:75:2B:4D:18" } ]
    actions = { update-props = { "bluez5.codecs" = [ aac sbc ] } }
  }
]
